plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.3'
}

android {
    namespace 'com.crf1.godhand'
    compileSdk 35

    defaultConfig {
        applicationId 'com.crf1.godhand'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-iso-launcher'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'

            // Build only the actual JNI library used by this Android app.
            // The reference runtime also defines a standalone ps2EntryRunner
            // shared target for Android, but it is not the app's entry point
            // and has unresolved desktop/runner input hooks when linked alone.
            // godhand_android already links its required native dependencies.
            targets 'godhand_android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
