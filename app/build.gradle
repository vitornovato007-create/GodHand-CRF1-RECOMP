plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.3'
}

android {
    namespace 'com.crf1.godhand'
    compileSdk 35

    defaultConfig {
        applicationId 'com.crf1.godhand'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-iso-launcher'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra'

                // Restrict the native build to the JNI library used by this app.
                // Keep this inside defaultConfig: AGP reads the requested native
                // targets from the variant's externalNativeBuild configuration.
                targets += ['godhand_android']
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            // Native DWARF symbols are split by CMake into build/native-symbols.
            // Keep the APK's .so files stripped while preserving external symbols.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
