name: Android ARM64

# Deliberately manual-only: repository edits must never start a build automatically.
# The maintainer starts the build from Actions after reviewing the changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Build APK ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Print toolchain diagnostics
        shell: bash
        run: |
          set -euo pipefail
          java -version
          sdkmanager --version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

      - name: Fetch pinned reference-generated God Hand C++ sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external
          git clone --filter=blob:none --no-checkout https://github.com/owaissseeee/GodHandAndroidPort.git external/GodHandAndroidPort
          git -C external/GodHandAndroidPort sparse-checkout init --cone
          git -C external/GodHandAndroidPort sparse-checkout set \
            app/src/main/cpp/generated \
            app/src/main/cpp/generated_unity \
            app/src/main/cpp/thirdparty/simde
          git -C external/GodHandAndroidPort checkout --detach 5f14ee6a84eb0213372c054c690e6a58513c1a17
          git -C external/GodHandAndroidPort submodule update --init --depth 1 app/src/main/cpp/thirdparty/simde
          test -s external/GodHandAndroidPort/app/src/main/cpp/generated/register_functions.cpp
          test -s external/GodHandAndroidPort/app/src/main/cpp/generated/ps2_recompiled_functions.h
          test "$(find external/GodHandAndroidPort/app/src/main/cpp/generated_unity -maxdepth 1 -name 'gh_unity_batch_*.cpp' | wc -l)" -ge 60
          echo "Reference-generated God Hand boot sources are present."

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --parallel :app:assembleDebug

      - name: Verify APK and ARM64 native library
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build/apk-check
          unzip -q "$APK" -d build/apk-check
          test -s build/apk-check/lib/arm64-v8a/libgodhand_android.so
          echo "APK criado: $APK"
          echo "Biblioteca ARM64 encontrada: lib/arm64-v8a/libgodhand_android.so"
          file build/apk-check/lib/arm64-v8a/libgodhand_android.so

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodHand-CRF1-Android-ARM64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
