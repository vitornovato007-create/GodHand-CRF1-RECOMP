name: Android ARM64

# Deliberately manual-only: repository edits must never start a build automatically.
# The maintainer starts the build from Actions after reviewing the changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Build APK ARM64
    runs-on: ubuntu-24.04
    # The native build is large and intentionally throttled to reduce peak RAM.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Print toolchain and memory diagnostics
        shell: bash
        run: |
          set -euo pipefail
          java -version
          sdkmanager --version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "CPU threads: $(nproc)"
          echo "--- RAM ---"
          free -h
          echo "--- /proc/meminfo ---"
          grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo
          echo "--- cgroup memory limits ---"
          for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events; do
            if [ -r "$f" ]; then
              echo "### $f"
              cat "$f"
            fi
          done

      - name: Fetch pinned Android runtime, graphics and game sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external
          git clone --filter=blob:none --no-checkout https://github.com/owaissseeee/GodHandAndroidPort.git external/GodHandAndroidPort
          git -C external/GodHandAndroidPort sparse-checkout init --cone
          # The Android renderer, runtime, IOP, audio and SNR2 overlays live beside
          # the generated EE batches. Check out the complete C++ subtree so CMake
          # builds one coherent reference port rather than a runtime-only stub.
          git -C external/GodHandAndroidPort sparse-checkout set app/src/main/cpp
          git -C external/GodHandAndroidPort checkout --detach 5f14ee6a84eb0213372c054c690e6a58513c1a17

          # The reference repository pins SIMDe as a gitlink but does not publish
          # a .gitmodules file. Fetch that exact gitlink commit explicitly.
          mkdir -p external/GodHandAndroidPort/app/src/main/cpp/thirdparty
          rm -rf external/GodHandAndroidPort/app/src/main/cpp/thirdparty/simde
          git clone --filter=blob:none --no-checkout https://github.com/simd-everywhere/simde.git external/GodHandAndroidPort/app/src/main/cpp/thirdparty/simde
          git -C external/GodHandAndroidPort/app/src/main/cpp/thirdparty/simde checkout --detach 2e5224981e9123b8fe89a9833a978556d636a565

          # Oboe is also a pinned gitlink in the reference repository.
          rm -rf external/GodHandAndroidPort/app/src/main/cpp/thirdparty/oboe
          git clone --filter=blob:none --no-checkout https://github.com/google/oboe.git external/GodHandAndroidPort/app/src/main/cpp/thirdparty/oboe
          git -C external/GodHandAndroidPort/app/src/main/cpp/thirdparty/oboe checkout --detach 4468344c8fdfdd7df068d5abefe2d8615fd6b431

          test -s external/GodHandAndroidPort/app/src/main/cpp/CMakeLists.txt
          test -s external/GodHandAndroidPort/app/src/main/cpp/jni_bridge.cpp
          test -s external/GodHandAndroidPort/app/src/main/cpp/src/main.cpp
          test -s external/GodHandAndroidPort/app/src/main/cpp/generated/register_functions.cpp
          test -s external/GodHandAndroidPort/app/src/main/cpp/thirdparty/oboe/CMakeLists.txt
          test -s external/GodHandAndroidPort/app/src/main/cpp/generated/ps2_recompiled_functions.h
          test "$(find external/GodHandAndroidPort/app/src/main/cpp/generated_unity -maxdepth 1 -name 'gh_unity_batch_*.cpp' | wc -l)" -ge 60
          test "$(find external/GodHandAndroidPort/app/src/main/cpp/generated_modules_unity -maxdepth 1 -name 'gh_mod_unity_*.cpp' | wc -l)" -ge 80
          test -s external/GodHandAndroidPort/app/src/main/cpp/thirdparty/pcsx2-gs-android/CMakeLists.txt
          echo "Reference boot, graphics, audio, generated EE and SNR2 sources are present."

      - name: Build optimized Release APK with bounded parallelism and RAM monitoring
        shell: bash
        env:
          # CMake honors this when its build invocation does not override job count.
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          set -Eeuo pipefail

          report_memory() {
            while true; do
              echo "===== Native build memory report $(date -u +'%Y-%m-%dT%H:%M:%SZ') ====="
              free -h
              grep -E 'MemAvailable|SwapFree' /proc/meminfo || true
              for f in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
                if [ -r "$f" ]; then
                  echo "### $f"
                  cat "$f"
                fi
              done
              sleep 60
            done
          }

          report_memory &
          monitor_pid=$!
          cleanup_monitor() {
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
          }
          trap cleanup_monitor EXIT

          echo "Building ARM64 APK with at most 2 Gradle workers."
          echo "Gradle parallel project execution is disabled to reduce peak memory."
          gradle --no-daemon --stacktrace --max-workers=2 --no-parallel :app:assembleRelease

      - name: Verify APK and ARM64 native library
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p build/apk-check
          unzip -q "$APK" -d build/apk-check
          echo "--- Bibliotecas ARM64 empacotadas no APK ---"
          find build/apk-check/lib/arm64-v8a -maxdepth 1 -type f -name "*.so" -printf "%f %s bytes\\n" | sort
          test -s build/apk-check/lib/arm64-v8a/libgodhand_android.so
          test -s build/apk-check/lib/arm64-v8a/libpcsx2gs.so
          echo "APK criado: $APK"
          echo "Bibliotecas ARM64 encontradas: libgodhand_android.so e libpcsx2gs.so"
          file build/apk-check/lib/arm64-v8a/libgodhand_android.so
          echo "--- Bibliotecas ARM64 realmente empacotadas ---"
          find build/apk-check/lib/arm64-v8a -maxdepth 1 -type f -name "*.so" -printf "%f %s bytes\\n" | sort
          readelf -h build/apk-check/lib/arm64-v8a/libgodhand_android.so | grep -E "Class:|Machine:"

          SO="build/apk-check/lib/arm64-v8a/libgodhand_android.so"
          for symbol in \
            Java_com_crf1_godhand_RuntimeBridge_nativeConfigureCrashLog \
            Java_com_crf1_godhand_RuntimeBridge_nativeWriteDiagnostic \
            Java_com_crf1_godhand_RuntimeBridge_nativeRuntimeStatus \
            Java_com_crf1_godhand_RuntimeBridge_nativeInspectIso \
            Java_com_crf1_godhand_RuntimeBridge_extractAndCacheIsoFromFd \
            Java_com_crf1_godhand_RuntimeBridge_onSurfaceCreated \
            Java_com_crf1_godhand_RuntimeBridge_onSurfaceDestroyed; do
            if ! readelf --wide --dyn-syms "$SO" | grep -F "$symbol" >/dev/null; then
              echo "Required JNI integration symbol is missing: $symbol" >&2
              exit 1
            fi
          done
          echo "Required ISO extraction, runtime status and Android surface JNI symbols are exported."

      - name: Verify and package external native debug symbols
        shell: bash
        run: |
          set -euo pipefail
          SYMBOL_DIR="build/native-symbols/arm64-v8a"
          test -s "$SYMBOL_DIR/libgodhand_android.so.debug"
          test -s "$SYMBOL_DIR/libpcsx2gs.so.debug"
          APK_BUILD_ID="$(readelf -n build/apk-check/lib/arm64-v8a/libgodhand_android.so | sed -n 's/.*Build ID: //p' | head -n1)"
          DEBUG_BUILD_ID="$(readelf -n "$SYMBOL_DIR/libgodhand_android.so.debug" | sed -n 's/.*Build ID: //p' | head -n1)"
          test -n "$APK_BUILD_ID"
          test "$APK_BUILD_ID" = "$DEBUG_BUILD_ID"
          echo "Matching libgodhand_android.so Build ID: $APK_BUILD_ID"
          APK_GS_BUILD_ID="$(readelf -n build/apk-check/lib/arm64-v8a/libpcsx2gs.so | sed -n 's/.*Build ID: //p' | head -n1)"
          DEBUG_GS_BUILD_ID="$(readelf -n "$SYMBOL_DIR/libpcsx2gs.so.debug" | sed -n 's/.*Build ID: //p' | head -n1)"
          test -n "$APK_GS_BUILD_ID"
          test "$APK_GS_BUILD_ID" = "$DEBUG_GS_BUILD_ID"
          echo "Matching libpcsx2gs.so Build ID: $APK_GS_BUILD_ID"
          mkdir -p build/artifacts
          (
            cd build/native-symbols
            zip -qr ../artifacts/GodHand-CRF1-native-symbols-arm64.zip .
          )
          echo "--- Native library Build IDs ---"
          readelf -n build/apk-check/lib/arm64-v8a/libgodhand_android.so | grep -A1 "Build ID" || true
          echo "--- External symbol files ---"
          find "$SYMBOL_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -s build/artifacts/GodHand-CRF1-native-symbols-arm64.zip

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodHand-CRF1-Android-ARM64-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload matching native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: GodHand-CRF1-native-symbols-arm64
          path: build/artifacts/GodHand-CRF1-native-symbols-arm64.zip
          if-no-files-found: error
          retention-days: 90
