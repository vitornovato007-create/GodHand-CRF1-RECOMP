name: Android ARM64

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build APK ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build debug APK
        run: gradle --no-daemon --parallel :app:assembleDebug

      - name: Verify APK and ARM64 native library
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build/apk-check
          unzip -q "$APK" -d build/apk-check
          test -s build/apk-check/lib/arm64-v8a/libgodhand_android.so
          echo "APK criado: $APK"
          echo "Biblioteca ARM64 encontrada: lib/arm64-v8a/libgodhand_android.so"
          file build/apk-check/lib/arm64-v8a/libgodhand_android.so

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodHand-CRF1-Android-ARM64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
