name: Android ARM64

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build APK ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # v4 avoids the old Node 20 runtime used by setup-android@v3.
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Print toolchain diagnostics
        shell: bash
        run: |
          set -euo pipefail
          java -version
          sdkmanager --version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --parallel :app:assembleDebug

      - name: Verify APK and ARM64 native library
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build/apk-check
          unzip -q "$APK" -d build/apk-check
          test -s build/apk-check/lib/arm64-v8a/libgodhand_android.so
          echo "APK criado: $APK"
          echo "Biblioteca ARM64 encontrada: lib/arm64-v8a/libgodhand_android.so"
          file build/apk-check/lib/arm64-v8a/libgodhand_android.so

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodHand-CRF1-Android-ARM64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
